# target.example.yaml — 复制为 target.yaml 后填写。这是唯一需要你提供的背景信息。
# 缺项时编码 agent 会向你提问，不会自行假设。
# 注：每个主机的 work_dir 是该主机上模板唯一允许写入的目录，必须由用户确认
#（Phase 0 缺项时 agent 必须询问确认，不得自行假设或写入其他路径）。
# 可选预检（Phase 1/2 之间）：`bash run.sh --detect-gmu` 再轮询 `bash run.sh --poll`
#（--load-format dummy 快速起服，探测最大可用 gpu-memory-utilization；结果回传本机 gmu_probe.json）→
# gmu_suggested 建议用进后续 config.yaml 的 serve.gpu-memory-utilization。

hosts:                          # 1..N 台。v1 只在 role=head 的主机上跑实验，其余仅做采集探测。
  - name: head
    ssh: user@10.0.0.1          # 可路由的 ssh 目标
    role: head
    work_dir: ~/vllm-autotune   # 专属目录（必须由用户确认）；模板除此外绝不写入主机
  # - name: worker1
  #   ssh: user@10.0.0.2
  #   role: worker
  #   work_dir: ~/vllm-autotune

model:
  id: Qwen/Qwen3-32B            # HF 模型 id 或本地路径
  source: hf                    # hf | local
  # path: /models/qwen3-32b     # source=local 时必填；docker 运行时也必填（宿主目录，挂载进容器）
  trust_remote_code: false
  # hf_token_env: HF_TOKEN      # gated 模型时填写环境变量名

metrics:                        # 可选。缺省则用 harness.yaml 的默认 SLO。
  # 此 SLO 应为该主机/模型可达值；若基线不可达，agent 会按 program.md 做一次性校准并在 report 标注，不会为此打断你。
  slo:
    ttft_p99_ms: 500
    tpot_p99_ms: 50

workload:                       # 可选。缺省则用 harness.yaml 默认。
  dataset: random               # random | sharegpt
  isl: 2048
  osl: 256
  num_prompts: 1000
  ref_concurrency: 128         # 覆盖 harness.yaml 的 bench.ref_concurrency（参考并发点）
  prefix_hit_pct: 0            # 可选。0 = 无共享前缀（默认）；>0 = 目标前缀缓存命中率（%，仅 random）

budget:                         # 主退出条件（过夜场景必填；max_hours 与 stop_at 二选一，同时填写时 max_hours 优先）
  max_hours: 10                 # 运行满 N 小时后停止
  # stop_at: "08:00"            # 或指定停止时刻（启动后下一个该时刻，按编排机本地时钟，跨天自动理解）

# fallbacks:                    # 可选。预授权运行期自主切换的候选（需工具支持；当前未实现，勿依赖）。
#   - host: user@10.0.0.3       # 备用主机
#     model:
#       id: Qwen/Qwen3-32B      # 备用模型（可省略 = 沿用主模型）
