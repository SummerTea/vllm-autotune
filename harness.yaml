# harness.yaml — 只读。全局默认值与循环控制参数。
# 修改此文件会破坏实验可比性；使用者应通过 target.yaml 覆盖允许的项。
# 本文件由 bench.py / report.py / program.md 共同引用。

bench:
  tool: vllm bench serve        # 真实的度量命令（非可执行别名）
  repeats: 2                    # 每个配置重复次数，取中位数抗噪
  noise_band_pct: 3.0           # 改进需超过该百分比才算有效提升（keep 阈值）
  startup_timeout_s: 1200       # 服务器启动就绪超时（大模型加载可能很慢）
  trial_timeout_s: 2400         # 单次实验硬超时
  ref_concurrency: 128          # 参考并发点
  gmu_detect:                   # --detect-gmu 预检（--load-format dummy 快速起服，从高到低探测
    start: 0.98                 #   最大可用 gpu-memory-utilization，避免共享主机 OOM）
    step: 0.02                  # 每级下降步长
    floor: 0.10                 # 最低尝试值（再低视为无法起服）
    ready_timeout_s: 120        # 每级等待 /health 就绪超时（dummy 权重秒级起服）
    total_timeout_s: 900        # 整个探测的总预算（防止 45 级全失败时耗时失控）

slo:                            # goodput 约束；可被 target.yaml 的 metrics.slo 覆盖
  ttft_p99_ms: 500
  tpot_p99_ms: 50

workload:                       # 合成 workload 默认；可被 target.yaml 的 workload 覆盖
  dataset: random
  isl: 2048
  osl: 256
  num_prompts: 1000
  prefix_hit_pct: 0            # 0 = 无共享前缀；>0 = 目标前缀缓存命中率（%，仅 random 数据集生效）：
                               #   按 isl×pct/100 拆共享前缀（--random-prefix-len）+ 余量，
                               #   让 enable-prefix-caching 成为可测维度（random 默认无共享前缀）

exit:                           # 三层退出（主退出 max_hours/stop_at 来自 target.yaml budget）
  plateau_trials: 8             # 连续 N 次无超过 noise_band_pct 的改进 → 平台期退出
  crash_streak: 3               # 连续 N 次 crash → 停下并报告

remote:
  vllm_port: 8000               # head 节点上 vllm serve 绑定的端口
  vllm_python: python           # 远端运行 bench.py 的 python 解释器（须自带 pyyaml）

runtime: {}                     # docker-only；可被 config.yaml 的 runtime 逐键覆盖（image 等）
