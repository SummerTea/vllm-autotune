# config.yaml — ★ agent 唯一编辑的文件。这是"一次实验"的全部输入。
# 每次实验只改这里，然后 commit + 运行 run.sh。
# 基线状态：serve 为空，即除必要参数外不加任何调优项。

# 可选预检（Phase 1/2 之间）：`bash run.sh --detect-gmu` 再轮询 `bash run.sh --poll`
# 用 --load-format dummy 快速起服，从高到低探测最大可用 gpu-memory-utilization，
# 产出 gmu_probe.json 的 gmu_suggested（共享主机易 OOM，先找安全上限再调参）。
# 建议把它写进下方 serve.gpu-memory-utilization 后再跑正式 trial。

# 前缀缓存测量：target/harness 的 workload.prefix_hit_pct（仅 random 数据集）>0 时，
# bench 按 isl×pct/100 拆共享前缀（--random-prefix-len + --random-input-len 余量），
# enable-prefix-caching 才可测出收益；repeats≥2 前会 POST /reset_prefix_cache 保证冷缓存独立测量。

env: {}                         # 进程级环境变量，随每次 server 启动注入（如 NCCL_*、VLLM_*）；
                                # NUMA 限定可见 GPU 用 CUDA_VISIBLE_DEVICES（如 "0,1,2,3"，tp 按可见数设置）

model:                          # 可选：覆盖 target.yaml 的模型（如量化变体 repo id）。留空则不覆盖。
runtime: {}                     # 可选；覆盖 harness.yaml 的 runtime 默认（逐键合并）。docker-only 示例：
# runtime:
#   image: vllm/vllm-openai:v0.31.0     # ★ 合法的搜索维度（如 CUDA 12/13 变体镜像）；默认不 pull，需预先准备
#   container_model_path: /model        # 容器内模型挂载点（默认 /model）
#   shm_size: 16g                       # --shm-size（默认 16g）
#   extra_docker_args: []                # 附加 docker run 参数（--ipc=host/--shm-size 已含默认，无需重复）；
#                                        # NUMA 对齐可 opt-in 传 --cpuset-cpus/--cpuset-mems（仅影响本 trial 容器，
#                                        #   不改变主机）；限定可见 GPU 用 env.CUDA_VISIBLE_DEVICES——勿经此传 --gpus，
#                                        #   构建器已固定 --gpus all，再传会重复冲突
serve: {}                       # vLLM serve 参数，kebab-case 作为 CLI flag。
                                # flag 名会对照镜像 `vllm serve --help` 预校验（未知名直接 crash）；
                                # 布尔约定：true → 裸 flag（--enable-x）；false → 省略（保持默认）；
                                # 要关闭默认开启的开关，写 no-<flag>: true（原样透传为 --no-<flag>）。例如：
# serve:
#   max-num-seqs: 256
#   max-num-batched-tokens: 8192
#   gpu-memory-utilization: 0.92
#   kv-cache-dtype: fp8
#   enable-prefix-caching: true
#   tensor-parallel-size: 8

# bench:                         # 可选。逐键覆盖 harness.yaml 的 bench 默认（均为实验输入，逐键合并）：
#   repeats: 3                   #   实测重复次数：取中位数抗噪。高方差配置 / confirm 回归可调高
#                                #   （探索 2-3，confirm 5-8）以提高显著性；repeats 改变即改测量协议。
#   warmup_repeats: 1            #   丢弃的预热轮数（消除首轮冷启动污染；0 = 关闭，行为回退旧口径）。
#                                #   协议（repeats / warmup_repeats）会写入 result.json 并记入账本
#                                #   （results.tsv 的 repeats / warmup_repeats 列）。
#   startup_timeout_s: 1200      #   起服就绪超时（秒）；超时 → 清晰 crash。
#   trial_timeout_s: 2400        #   单次 trial 硬超时（秒）；超时 → 清晰 crash。
#   seed: 0                      #   bench 随机种子——改变即改变 prompt 语料，属 workload 身份
#                                #   （workload_hash 覆盖 seed）。
#   require_idle: false          #   true → 检测到共租 GPU 进程即 crash（要求独占）。
#                                #   gmu_detect / ref_concurrency 亦可覆盖（见 harness.yaml 注释）。
